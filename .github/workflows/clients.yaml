name: Update Multiple Clients

on:
  push:
    paths:
      - .clients
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without writing or committing
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: clients-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - name: Run regression tests
        run: python -B .github/scripts/test_update_clients.py
      - name: Plan update clients
        id: update
        run: |
          args=()
          dry_run=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] &&
             git show "${{ github.event.before }}:.clients" > "$RUNNER_TEMP/clients-before" 2>/dev/null; then
            args+=(--previous-clients "$RUNNER_TEMP/clients-before")
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] &&
             { [[ "$GITHUB_REF_TYPE" != "branch" ]] || [[ "$INPUT_DRY_RUN" == "true" ]]; }; then
            args+=(--dry-run)
            dry_run=true
          fi
          python -B .github/scripts/update_clients.py \
            --repo-root . \
            --clients .clients \
            --summary "$RUNNER_TEMP/clients-summary.json" \
            --paths-file "$RUNNER_TEMP/clients-changed-paths" \
            --github-output "$GITHUB_OUTPUT" \
            "${args[@]}"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
      - name: Verify exact Git scope
        if: steps.update.outputs.changed == 'true' && steps.update.outputs.dry_run == 'false'
        run: |
          python -B .github/scripts/update_clients.py \
            --repo-root . \
            --paths-file "$RUNNER_TEMP/clients-changed-paths" \
            --verify-git
      - name: Commit and push exact changed paths
        if: steps.update.outputs.changed == 'true' && steps.update.outputs.dry_run == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git --literal-pathspecs add --pathspec-from-file="$RUNNER_TEMP/clients-changed-paths" --pathspec-file-nul
          git commit --quiet -m "Update clients (${GITHUB_REF_NAME})"
          git push
