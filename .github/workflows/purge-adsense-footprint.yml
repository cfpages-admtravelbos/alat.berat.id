name: Purge Google AdSense Footprint

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: purge-adsense-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.13"

      - name: Run purge regression tests
        run: python .github/scripts/test_purge_adsense_footprint.py

      - name: Execute AdSense Purge Engine
        run: |
          python .github/scripts/purge_adsense_footprint.py apply --root "$GITHUB_WORKSPACE"

      - name: Commit and push changes
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No files modified or deleted. AdSense footprint already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(adsense): purge Google AdSense script, ads.txt, and legacy workflows [skip ci]"
          git push origin "HEAD:${TARGET_REF}"
