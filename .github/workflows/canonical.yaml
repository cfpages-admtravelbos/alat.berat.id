name: Normalize HTML Canonical Tags v2

on:
  workflow_dispatch:
    inputs:
      site_origin:
        description: Optional reviewed https origin override
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: canonical-tags-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Run normalizer regression tests
        run: python .github/scripts/test_update_canonical_tags.py

      - name: Normalize canonical tags
        env:
          SITE_ORIGIN: ${{ inputs.site_origin }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/update_canonical_tags.py normalize \
            --root "$GITHUB_WORKSPACE" \
            --repository "$TARGET_REPOSITORY" \
            --site-origin "$SITE_ORIGIN" \
            --manifest "$RUNNER_TEMP/canonical-changed-paths.bin" \
            --summary "$RUNNER_TEMP/canonical-summary.json"

      - name: Verify and stage exact changed paths
        run: |
          python .github/scripts/update_canonical_tags.py stage \
            --root "$GITHUB_WORKSPACE" \
            --manifest "$RUNNER_TEMP/canonical-changed-paths.bin"

      - name: Commit and push exact changes
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          if git diff --cached --quiet; then
            echo "No canonical-tag changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize HTML canonical tags"
          git push origin "HEAD:${TARGET_REF}"
